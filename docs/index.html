<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Clojkstra — ClojureScript + re-frame starter template"
        />

        <title>Clojkstra</title>

        <!-- Favicon (inline SVG data URI — no extra files needed) -->
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"
        />

        <!-- Tailwind CSS via CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Inter", "system-ui", "sans-serif"],
                            serif: [
                                "Charter",
                                "Georgia",
                                "Palatino",
                                "Times New Roman",
                                "serif",
                            ],
                            mono: [
                                "JetBrains Mono",
                                "ui-monospace",
                                "monospace",
                            ],
                        },
                        colors: {
                            // Backgrounds
                            base: "var(--kami-parchment)", // primary app bg
                            surface: "var(--kami-ivory)", // card / panel bg
                            overlay: "var(--kami-warm-sand)", // popup / badge / input bg

                            // Foregrounds
                            "on-base": "var(--kami-near-black)", // primary text (on base or surface)
                            subtle: "var(--kami-dark-warm)", // secondary text, ghost controls
                            muted: "var(--kami-olive)", // disabled, placeholder, captions

                            // Structure
                            edge: "var(--kami-border)", // borders, separators
                            selection: "var(--kami-border-soft)", // hover fill, selected bg
                            lo: "var(--kami-warm-sand)", // cursorline, low-emphasis bg

                            // Accents
                            accent: "var(--kami-brand)", // primary interactive accent, links, focus
                            "accent-hi": "var(--kami-brand-light)", // accent hover / info body text

                            // Semantic status (approximated for Kami)
                            danger: "#c96442", // error
                            warn: "#d4a055", // warnings
                            ok: "#507a55", // success
                            "info-hi": "var(--kami-brand-light)", // info alert body text
                        },
                    },
                },
            };
        </script>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />

        <style>
            :root {
                --kami-brand: #1b365d;
                --kami-brand-light: #2d5a8a;

                --kami-parchment: #f5f4ed;
                --kami-ivory: #faf9f5;
                --kami-warm-sand: #e8e6dc;

                --kami-near-black: #141413;
                --kami-dark-warm: #3d3d3a;
                --kami-olive: #504e49;
                --kami-stone: #6b6a64;

                --kami-border: #e8e6dc;
                --kami-border-soft: #e5e3d8;
            }

            /* Prevent flash of unstyled content while ClojureScript loads */
            #app:empty {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                background: var(--kami-parchment);
            }
            #app:empty::after {
                content: "";
                width: 2.5rem;
                height: 2.5rem;
                border: 3px solid var(--kami-border);
                border-top-color: var(--kami-brand);
                border-radius: 50%;
                animation: spin 0.7s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body class="bg-base text-on-base font-serif antialiased">
        <!-- React/Reagent mounts here — do not put content inside this div -->
        <div id="app"></div>

        <!-- ClojureScript bundle produced by shadow-cljs -->
        <script src="cljs-out/main.js"></script>
    </body>
</html>
